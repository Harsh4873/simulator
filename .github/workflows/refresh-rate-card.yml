name: Refresh simulator rate card
on:
  schedule:
    # Frequent runs cover missed cron deliveries and evening injury changes (UTC).
    - cron: "17 11,14,17,20,22,23 * * *"
    - cron: "17 0,1,2 * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "timer paces like the schedule; anything else forces a full refresh"
        required: false
        default: manual
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: simulator-rate-card
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.21.1"
          cache: npm
      - name: Check pre-tip refresh window
        id: window
        env:
          REFRESH_TRIGGER: ${{ inputs.trigger }}
        run: node --experimental-strip-types scripts/refresh-window.ts
      - name: Install dependencies
        run: npm ci
      - name: Build the rate card
        env:
          PRETIP_WINDOW: ${{ steps.window.outputs.run }}
        run: |
          if [ "$PRETIP_WINDOW" = true ]; then
            GENERATOR_SHA="$(git rev-parse HEAD)" npm run rate-card
          else
            GENERATOR_SHA="$(git rev-parse HEAD)" npm run rate-card -- --cached-summaries
          fi
      - name: Refit prop calibration
        # Refits each stat group's map on settled live ledger rows and checks it on later games it never saw.
        # A failure keeps the last maps, which stop applying a week after their check.
        continue-on-error: true
        run: npm run calibrate-props
      - name: Compare with posted lines and grade earlier leans
        # Prices are read after the draws exist and never reach the fit. A failure here leaves the rate card as built.
        continue-on-error: true
        run: npm run picks
      - name: Refresh NFL and esports slates
        # A missed feed leaves the last published files. It does not block the rate card.
        continue-on-error: true
        run: npm run slates
      - name: Post and grade the bets of the day
        # NBA team bets and player props, and NFL team bets from the slate just built. Posts a pick only where a category
        # has none open, and grades posted picks from the scoreboards' finals and the cached box scores. A failure leaves
        # every posted pick and the published file as they were.
        continue-on-error: true
        run: npm run daily
      - name: Write the matchup report
        # Reads the shooting cache and the committed card. A failure leaves the previous file.
        continue-on-error: true
        run: npm run matchups
      - name: Verify before publication
        run: |
          npm test
          npm run typecheck
          npm run build
          npm run validate-artifact
          npm run validate-privacy
      - name: Commit validated generation
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Harsh4873
          git config user.email '43502626+Harsh4873@users.noreply.github.com'
          git fetch origin main
          # Never copy an old build onto a newer generator revision. A later run rebuilds.
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git add -- public/data/slate.json public/data/rate-card.json public/data/manifest.json public/data/picks.json data/shooting-cache.json data/play-history.json.gz data/forecast-archive data/market-archive data/pick-ledger data/prop-calibration
          # A withdrawn map deletes the published file, and that deletion has to reach the site too.
          if [ -f public/data/prop-calibration.json ] || git ls-files --error-unmatch public/data/prop-calibration.json >/dev/null 2>&1; then
            git add -A -- public/data/prop-calibration.json
          fi
          if [ -f public/data/nfl.json ]; then
            git add -- public/data/nfl.json
          fi
          if [ -f public/data/esports.json ]; then
            git add -- public/data/esports.json
          fi
          if [ -f public/data/matchups.json ]; then
            git add -- public/data/matchups.json
          fi
          # Every posted bet of the day, and the page's copy of the slate's two days with the record.
          if [ -f public/data/daily.json ]; then
            git add -- public/data/daily.json
          fi
          if [ -d data/daily-ledger ]; then
            git add -- data/daily-ledger
          fi
          # NFL box scores the simulation reads. Off the site; only newly finished games change it.
          if [ -f data/nfl-cache.json ]; then
            git add -- data/nfl-cache.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore(data): refresh validated simulator generation'
            AUTHOR=$(git show -s --format='%an' HEAD)
            test "$AUTHOR" = Harsh4873
            test "$(git show -s --format='%ae' HEAD)" = '43502626+Harsh4873@users.noreply.github.com'
            test "$(git show -s --format='%cn <%ce>' HEAD)" = 'Harsh4873 <43502626+Harsh4873@users.noreply.github.com>'
            if git log -1 --format=%B | grep -qi 'Co-authored-by:'; then
              echo 'Unexpected commit trailer'
              exit 1
            fi
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Deploy and verify completion
        # Also dispatch when no data changed, so a failed previous deployment can recover.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
        run: node scripts/deploy-and-wait.mjs
      - name: Schedule the next refresh
        # Runs after failures too, so one bad run cannot stop the cadence.
        if: always() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/schedule-refresh.ts
