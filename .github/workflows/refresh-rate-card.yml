name: Refresh simulator rate card
on:
  schedule:
    # GitHub cron is UTC. 11:30 and 18:00 UTC are 6:30am and 1:00pm
    # America/Chicago while CDT is in effect, and 5:30am and noon after
    # the clock falls back to CST. Both are before evening tips.
    # Do not also set a timezone field; that would double-fire.
    - cron: "30 11 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: simulator-rate-card
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the rate card
        run: npm run rate-card

      - name: Commit rate card if changed
        shell: bash
        run: |
          set -euo pipefail
          ACTOR_EMAIL="${GITHUB_ACTOR_ID:-41898282}+${GITHUB_ACTOR}@users.noreply.github.com"
          git config user.name  "${GITHUB_ACTOR}"
          git config user.email "${ACTOR_EMAIL}"
          BRANCH="main"
          if [ -z "$(git status --porcelain -- public/data/slate.json public/data/rate-card.json data/shooting-cache.json)" ]; then
            echo "No rate-card change — skipping commit."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/simulator-data"
          cp public/data/slate.json "$RUNNER_TEMP/simulator-data/slate.json"
          cp public/data/rate-card.json "$RUNNER_TEMP/simulator-data/rate-card.json"
          cp data/shooting-cache.json "$RUNNER_TEMP/simulator-data/shooting-cache.json"
          DATE=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const slate = JSON.parse(readFileSync('public/data/slate.json', 'utf8')); if (!slate.date) process.exit(1); process.stdout.write(String(slate.date));")
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/${BRANCH}"
            cp "$RUNNER_TEMP/simulator-data/slate.json" public/data/slate.json
            cp "$RUNNER_TEMP/simulator-data/rate-card.json" public/data/rate-card.json
            cp "$RUNNER_TEMP/simulator-data/shooting-cache.json" data/shooting-cache.json
            git add -- public/data/slate.json public/data/rate-card.json data/shooting-cache.json
            if git diff --cached --quiet; then
              echo "No staged change after rebase — skipping commit."
              exit 0
            fi
            git commit -m "chore(data): refresh simulator rate card for ${DATE}"
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying."
            if [ "$attempt" -lt 5 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          echo "Unable to publish the rate card after retrying."
          exit 1
