name: Refresh simulator rate card
on:
  schedule:
    # Frequent runs cover missed cron deliveries and evening injury changes (UTC).
    - cron: "17 11,14,17,20,22,23 * * *"
    - cron: "17 0,1,2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: simulator-rate-card
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: npm
      - name: Check pre-tip refresh window
        id: window
        run: node --experimental-strip-types scripts/refresh-window.ts
      - name: Install dependencies
        run: npm ci
      - name: Build the rate card
        env:
          PRETIP_WINDOW: ${{ steps.window.outputs.run }}
        run: |
          if [ "$PRETIP_WINDOW" = true ]; then
            GENERATOR_SHA="$(git rev-parse HEAD)" npm run rate-card
          else
            GENERATOR_SHA="$(git rev-parse HEAD)" npm run rate-card -- --cached-summaries
          fi
      - name: Verify before publication
        run: |
          npm test
          npm run typecheck
          npm run build
          npm run validate-artifact
          npm run validate-privacy
      - name: Commit validated generation
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_ACTOR" = 'github-actions[bot]' ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          elif [ "$GITHUB_ACTOR" = Harsh4873 ]; then
            git config user.name Harsh4873
            git config user.email '43502626+Harsh4873@users.noreply.github.com'
          else
            echo 'Unapproved manual refresh actor'
            exit 1
          fi
          git fetch origin main
          # Never copy an old build onto a newer generator revision. A later run rebuilds.
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git add -- public/data/slate.json public/data/rate-card.json public/data/manifest.json data/shooting-cache.json data/forecast-archive data/market-archive
          if ! git diff --cached --quiet; then
            git commit -m 'chore(data): refresh validated simulator generation'
            AUTHOR=$(git show -s --format='%an' HEAD)
            test "$AUTHOR" = Harsh4873 || test "$AUTHOR" = 'github-actions[bot]'
            if git log -1 --format=%B | grep -qi 'Co-authored-by:'; then
              echo 'Unexpected commit trailer'
              exit 1
            fi
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Deploy and verify completion
        # Also dispatch when no data changed, so a failed previous deployment can recover.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.commit.outputs.sha }}
        run: node scripts/deploy-and-wait.mjs
