name: Deploy Simulator to GitHub Pages
run-name: ${{ inputs.request_id || github.workflow }}

# Project site. The user site carries the harsh.bet domain, so this repo is
# served at /simulator/ because the repository is named simulator. No CNAME belongs here.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: Validated source commit
        required: false
        type: string
      request_id:
        description: Deployment correlation identifier
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/favicon.svg
          grep -Fq 'src="/simulator/assets/' dist/index.html
          grep -Fq 'href="/simulator/assets/' dist/index.html
          grep -Fq 'href="https://harsh.bet/simulator/"' dist/index.html
          npm run validate-artifact
          test ! -e CNAME
          test ! -e dist/CNAME
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
