name: Deploy Simulator to GitHub Pages
run-name: ${{ inputs.request_id || github.workflow }}

# Project site. The user site carries the harsh.bet domain, so this repo is
# served at /simulator/ because the repository is named simulator. No CNAME belongs here.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: Validated source commit
        required: false
        type: string
      checked_at:
        description: Successful source check timestamp
        type: string
      input_hash:
        description: Checked input hash
        type: string
      model_hash:
        description: Checked model hash
        type: string
      request_id:
        description: Deployment correlation identifier
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Verify immutable source
        env:
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Attach source check health
        env:
          CHECKED_AT: ${{ inputs.checked_at }}
          INPUT_HASH: ${{ inputs.input_hash }}
          MODEL_HASH: ${{ inputs.model_hash }}
        run: node scripts/write-health.mjs

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/favicon.svg
          grep -Fq 'src="/simulator/assets/' dist/index.html
          grep -Fq 'href="/simulator/assets/' dist/index.html
          grep -Fq 'href="https://harsh.bet/simulator/"' dist/index.html
          npm run validate-artifact
          npm run validate-privacy
          test ! -e CNAME
          test ! -e dist/CNAME
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
