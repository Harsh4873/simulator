name: Deploy Simulator to GitHub Pages
run-name: ${{ inputs.request_id || github.workflow }}

# Project site. The user site carries the harsh.bet domain, so this repo is
# served at /simulator/ because the repository is named simulator. No CNAME belongs here.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: Validated source commit
        required: false
        type: string
      checked_at:
        description: Successful source check timestamp
        type: string
      input_hash:
        description: Checked input hash
        type: string
      model_hash:
        description: Checked model hash
        type: string
      request_id:
        description: Deployment correlation identifier
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Verify immutable source
        env:
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.21.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # A source push has no new check. Keep the last published one for this same card,
      # or the rebuilt site treats a still-valid rate card as stale.
      - name: Attach source check health
        env:
          CHECKED_AT: ${{ inputs.checked_at }}
          INPUT_HASH: ${{ inputs.input_hash }}
          MODEL_HASH: ${{ inputs.model_hash }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/write-health.mjs

      # Each game's 10,000 draws are published as counts, so a phone reads them instead of running them. A failure here
      # leaves the page to draw its own games, so it never blocks the deploy.
      - name: Publish simulations
        continue-on-error: true
        run: node --experimental-strip-types scripts/publish-sims.ts dist/data

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/favicon.svg
          grep -Fq 'src="/simulator/assets/' dist/index.html
          grep -Fq 'href="/simulator/assets/' dist/index.html
          grep -Fq 'href="https://harsh.bet/simulator/"' dist/index.html
          npm run validate-artifact
          npm run validate-privacy
          test ! -e CNAME
          test ! -e dist/CNAME
          touch dist/.nojekyll

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The artifact listing can lag a finished upload: a deploy 0.3 s after "Artifact ID ..." once found no artifact.
      # Deploying from its own job, after the listing shows this upload, closes that window.
      - name: Wait for the uploaded Pages artifact to appear in this run
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages"
          for delay in 0 2 4 8 16 30; do
            sleep "$delay"
            # Read the listing whole: a failed request is one more retry, not a broken pipe.
            ids="$(gh api "$endpoint" --jq '.artifacts[] | select(.expired == false and .size_in_bytes > 0) | .id' || true)"
            if grep -Fxq "$ARTIFACT_ID" <<<"$ids"; then
              exit 0
            fi
          done
          echo "::error::Pages artifact $ARTIFACT_ID was uploaded but is unavailable in run $GITHUB_RUN_ID"
          exit 1

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
