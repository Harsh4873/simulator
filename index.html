<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("simulator.theme");
        } catch (e) {}
        var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        var theme = stored === "light" || stored === "dark" ? stored : prefersLight ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      html, body { background: #080b0f; color: #e8edf2; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f3f6f8; color: #14202b; }
    </style>
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#00e5a0" />
    <meta name="description" content="NBA simulator. Today's games in Chicago time, and one box score drawn from 10,000 simulated games." />
    <title>Simulator</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="canonical" href="https://harsh.bet/simulator/" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand">
          <p class="mark">Simulator</p>
          <button type="button" data-theme-toggle aria-pressed="false">Dark</button>
        </div>
        <p class="sub">NBA games today, Chicago time</p>
      </header>
      <main class="desk" id="desk" data-board data-mode="loading">
        <section class="frame" data-region="games" aria-labelledby="games-label">
          <p class="frame-label" id="games-label">Games</p>
          <div id="slate">
            <p class="state" role="status">Loading slate…</p>
          </div>
        </section>
        <section class="frame" data-region="stage" aria-labelledby="stage-label" hidden>
          <p class="frame-label" id="stage-label">Box score</p>
          <div id="boxscore"></div>
        </section>
        <aside class="frame panel" data-region="player" data-panel aria-labelledby="player-label" hidden>
          <p class="frame-label" id="player-label">Player</p>
          <div data-panel-body></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
