<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("simulator.theme");
        } catch (e) {}
        var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        var theme = stored === "light" || stored === "dark" ? stored : prefersLight ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      html, body { background: #0a0e13; color: #eef3f8; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f4f6f9; color: #0f1722; }
    </style>
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0a0e13" />
    <meta name="description" content="NBA simulator. Today and yesterday in Chicago time, 10,000 simulated games each, with your own lineup calls." />
    <title>Simulator</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="canonical" href="https://harsh.bet/simulator/" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.4"></circle>
            <path d="M3 16h26M16 3v26M7 7.5c4 3 4 14 0 17M25 7.5c-4 3-4 14 0 17" fill="none" stroke="currentColor" stroke-width="2"></path>
          </svg>
          <div class="brand-copy">
            <p class="mark">Simulator</p>
            <p class="sub">Today and yesterday, Chicago time</p>
          </div>
        </div>
        <div class="topbar-tools">
          <p class="fresh" data-fresh hidden></p>
          <button type="button" data-theme-toggle aria-pressed="false">Dark</button>
        </div>
      </div>
    </header>
    <div class="wrap">
      <main class="desk" id="desk" data-board data-mode="loading">
        <section class="frame" data-region="games" aria-labelledby="games-label">
          <p class="frame-label" id="games-label">Games</p>
          <div id="slate">
            <p class="state" role="status">Loading slate…</p>
          </div>
        </section>
        <section class="frame" data-region="stage" aria-labelledby="stage-label" hidden>
          <p class="frame-label" id="stage-label">Box score</p>
          <div id="boxscore"></div>
        </section>
        <aside class="frame panel" data-region="player" data-panel aria-labelledby="player-label" hidden>
          <p class="frame-label" id="player-label">Player</p>
          <div data-panel-body></div>
        </aside>
      </main>
      <footer class="foot">
        <p>A simulator, not a betting ticket. Each game is drawn 10,000 times from the published rate card. Data refreshes about every 45 minutes before tip.</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
