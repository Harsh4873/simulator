<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("simulator.theme");
        } catch (e) {}
        var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        var theme = stored === "light" || stored === "dark" ? stored : prefersLight ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("simulator.layout");
        } catch (e) {}
        var layout = stored === "phone" || stored === "laptop" ? stored : "laptop";
        document.documentElement.dataset.layout = layout;
      })();
    </script>
    <style>
      html, body { background: #0a0e13; color: #eef3f8; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f4f6f9; color: #0f1722; }
    </style>
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0a0e13" />
    <meta name="description" content="NBA simulator. Today and yesterday in Chicago time, 10,000 simulated games each, with your own lineup calls." />
    <title>Simulator</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="canonical" href="https://harsh.bet/simulator/" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="sport-switch" role="radiogroup" aria-label="Sport">
            <button type="button" data-sport="nba" role="radio" aria-checked="true" aria-label="NBA" tabindex="0">
              <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="16" cy="16" r="13"></circle>
                <path d="M3 16h26M16 3v26M7 7.5c4 3 4 14 0 17M25 7.5c-4 3-4 14 0 17"></path>
              </svg>
            </button>
            <button type="button" data-sport="nfl" role="radio" aria-checked="false" aria-label="NFL" tabindex="-1">
              <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M16 4c4.2 3.2 7 7.4 7 12s-2.8 8.8-7 12c-4.2-3.2-7-7.4-7-12s2.8-8.8 7-12z"></path>
                <path d="M16 9.5v13M13.2 13h5.6M13.2 16h5.6M13.2 19h5.6"></path>
              </svg>
            </button>
            <button type="button" data-sport="esports" role="radio" aria-checked="false" aria-label="Esports" tabindex="-1">
              <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="4" y="11" width="24" height="11" rx="4"></rect>
                <path d="M10 14.5v4M8 16.5h4"></path>
                <circle cx="20" cy="15.5" r="1.2"></circle>
                <circle cx="23.5" cy="17.5" r="1.2"></circle>
              </svg>
            </button>
          </div>
          <script>
            (function () {
              var stored = null;
              try {
                stored = sessionStorage.getItem("simulator.sport");
              } catch (e) {}
              if (stored !== "nfl" && stored !== "esports") return;
              var buttons = document.querySelectorAll("[data-sport]");
              for (var i = 0; i < buttons.length; i++) {
                var on = buttons[i].getAttribute("data-sport") === stored;
                buttons[i].setAttribute("aria-checked", on ? "true" : "false");
                buttons[i].setAttribute("tabindex", on ? "0" : "-1");
              }
            })();
          </script>
          <div class="brand-copy">
            <p class="mark">Simulator</p>
            <p class="sub">Today and yesterday, Chicago time</p>
          </div>
        </div>
        <nav class="panel-tabs desk-tabs" aria-label="Sections">
          <button type="button" data-desk-tab="games" aria-selected="true">Games</button>
          <button type="button" data-desk-tab="projections" aria-selected="false">Projections</button>
        </nav>
        <div class="topbar-tools">
          <p class="fresh" data-fresh hidden></p>
          <button type="button" data-theme-toggle aria-pressed="false">Dark</button>
          <button type="button" data-layout-toggle aria-pressed="false" aria-label="Phone or laptop layout">Laptop</button>
        </div>
      </div>
    </header>
    <div class="wrap">
      <main class="desk" id="desk" data-board data-mode="loading">
        <section class="frame" data-region="games" aria-labelledby="games-label">
          <p class="frame-label" id="games-label">Games</p>
          <div id="slate">
            <p class="state" role="status">Loading slate…</p>
          </div>
        </section>
        <section class="frame" data-region="stage" aria-labelledby="stage-label" hidden>
          <p class="frame-label" id="stage-label">Box score</p>
          <div id="boxscore"></div>
        </section>
        <aside class="frame panel" data-region="player" data-panel aria-labelledby="player-label" hidden>
          <p class="frame-label" id="player-label">Player</p>
          <div data-panel-body></div>
        </aside>
        <section class="frame" data-region="projections" hidden><div id="projections"></div></section>
      </main>
      <footer class="foot">
        <p>Each game is simulated 10,000 times. Lineup changes stay in this browser.</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
